    - taxpayerid
    - taxpayerno
    - tin
    - itin
    - ein
    - einno
    - fein
    - employeridentificationnumber
    - federalemployeridentificationnumber
    # Date of birth
    - dob
    - dateofbirth
    - birthdate
    - birthday
    - birthyear
    # Email
    - email
    - emailaddress
    - emailid
    - workemail
    - personalemail
    # Phone
    - phone
    - phonenumber
    - phoneno
    - phonenum
    - ph
    - phno
    - phnum
    - mobile
    - mobilenumber
    - mobileno
    - mobilephone
    - mob
    - mobno
    - cell
    - cellphone
